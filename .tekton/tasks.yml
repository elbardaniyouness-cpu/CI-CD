apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: remove-temp-files
      image: python:3.9
      script: |
        #!/bin/sh
        echo "Cleaning up workspace"
        rm -rf /workspace/source/*.pyc || true
        rm -rf /workspace/source/__pycache__ || true

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install nose
        nosetests
      
