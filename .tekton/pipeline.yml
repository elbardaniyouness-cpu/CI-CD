---
# flake8 task (defined here so the pipeline does not depend on Tekton Hub).
# Arguments are passed via an environment variable, not interpolated into the script.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "--count --max-complexity=10 --max-line-length=127 --statistics"
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: FLAKE8_ARGS
          value: $(params.args)
      script: |
        #!/bin/sh
        set -e
        python -m pip install -q --upgrade pip
        pip install -q flake8
        # shellcheck disable=SC2086
        flake8 service $FLAKE8_ARGS

---
# Deploy task: the image reference is passed via an environment variable
# (never interpolated into the script) and validated before use.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-image
spec:
  params:
    - name: IMAGE
      type: string
  steps:
    - name: deploy
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      env:
        - name: IMAGE
          value: $(params.IMAGE)
      script: |
        #!/bin/sh
        set -eu
        case "$IMAGE" in
          ""|*[!A-Za-z0-9./:@_-]*) echo "Invalid image reference" >&2; exit 1 ;;
        esac
        oc create deployment counter-service --image="$IMAGE" --dry-run=client -o yaml | oc apply -f -
        oc rollout restart deployment/counter-service || true

---
# OpenShift Pipeline: cleanup -> git-clone -> flake8 + nose -> buildah -> deploy
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: oc-final
spec:
  workspaces:
    - name: output
  params:
    - name: GIT_REPO
      type: string
      default: https://github.com/elbardaniyouness-cpu/CI-CD.git
    - name: GIT_REF
      type: string
      default: main
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: output

    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: output
      params:
        - name: url
          value: $(params.GIT_REPO)
        - name: revision
          value: $(params.GIT_REF)

    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: output

    - name: nose
      runAfter: [git-clone]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: output
      params:
        - name: args
          value: "-v --with-spec --spec-color"

    - name: buildah
      runAfter: [flake8, nose]
      taskRef:
        name: buildah
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: output
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/counter-service:latest

    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: deploy-image
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/counter-service:latest
